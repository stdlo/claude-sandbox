# Builds the sandbox image and publishes it to GitHub's container registry as ghcr.io/stdlo/claude-sandbox.
# Runs on every push to any branch, and by hand from the Actions tab (for example to pick up a new Claude Code
# release, since the Dockerfile installs whatever is current). There is no schedule. A branch's build is tagged
# only with its commit sha, so a broken change shows up before it merges; only main moves `latest`.
#
# Each architecture builds natively on its own runner (amd64 on ubuntu-latest, arm64 on ubuntu-24.04-arm) and
# pushes its image by digest; a final job stitches the two digests into one multi-arch manifest under the tags.
name: build

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

# A newer push to the same branch cancels a build still running for the older one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ${{ env.IMAGE }}

      # Push the image by digest only: `tags` here is just the image name buildx pushes to; the real tags go on
      # the merged manifest below.
      - uses: docker/build-push-action@v7
        id: build
        with:
          context: .
          platforms: ${{ matrix.platform }}
          tags: ${{ env.IMAGE }}
          labels: ${{ steps.meta.outputs.labels }}
          # No provenance attestation, so the merged manifest lists just the two platforms.
          provenance: false
          outputs: type=image,push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}

      # Hand the digest to the merge job as an empty file named after it.
      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}

      - uses: actions/upload-artifact@v7
        with:
          name: digest-${{ matrix.platform == 'linux/amd64' && 'amd64' || 'arm64' }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tags: `latest` on main, plus the short commit sha so any earlier build can still be pulled.
      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha

      - name: Create the multi-arch manifest
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf "$IMAGE@sha256:%s " *)
          docker buildx imagetools inspect "$IMAGE:${{ steps.meta.outputs.version }}"
